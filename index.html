<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TaskFlow AI — a simple, polished task manager in your browser."
    />
    <title>TaskFlow AI</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("taskflow_theme");
          if (theme !== "dark" && theme !== "light") {
            theme =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-background" aria-hidden="true"></div>

    <header class="app-header">
      <div class="header-brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="8" class="logo-bg" />
            <path
              d="M9 16.5L13.5 21L23 11"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div>
          <h1 class="app-title">TaskFlow AI</h1>
          <p class="app-tagline">Stay focused. Ship what matters.</p>
        </div>
      </div>

      <div class="header-actions">
        <label class="search-wrap">
          <span class="visually-hidden">Search tasks</span>
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
            <path d="M20 20l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input
            type="search"
            id="searchInput"
            placeholder="Search tasks…"
            autocomplete="off"
          />
        </label>
        <div class="header-actions-row">
          <button
            type="button"
            id="themeToggle"
            class="btn btn-icon"
            aria-label="Switch to dark mode"
            title="Toggle theme"
          >
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="none" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21 14.5A8.5 8.5 0 1112.5 3a6.5 6.5 0 009.5 11.5z"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="stats-grid" aria-label="Task statistics">
        <article class="stat-card">
          <p class="stat-label">Total tasks</p>
          <p class="stat-value" id="statTotal">0</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">Completed</p>
          <p class="stat-value" id="statCompleted">0</p>
        </article>
        <article class="stat-card stat-card-accent">
          <p class="stat-label">Completion rate</p>
          <p class="stat-value" id="statPercent">0%</p>
        </article>
      </section>

      <section class="panel card">
        <h2 class="panel-title">Add a task</h2>
        <form id="taskForm" class="task-form" novalidate>
          <div class="form-row">
            <div class="field field-grow">
              <label for="taskTitle">Title</label>
              <input
                type="text"
                id="taskTitle"
                name="title"
                placeholder="What do you need to do?"
                maxlength="120"
                required
              />
              <p class="field-error" id="titleError" role="alert"></p>
            </div>
            <div class="field">
              <label for="taskPriority">Priority</label>
              <select id="taskPriority" name="priority">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
            <div class="field">
              <label for="taskDueDate">Due date</label>
              <input type="date" id="taskDueDate" name="dueDate" required />
              <p class="field-error" id="dueDateError" role="alert"></p>
            </div>
            <button type="submit" class="btn btn-primary">Add task</button>
          </div>
        </form>
      </section>

      <section class="panel card">
        <div class="list-toolbar">
          <div class="filter-group" role="tablist" aria-label="Filter tasks">
            <button
              type="button"
              class="filter-btn is-active"
              data-filter="all"
              role="tab"
              aria-selected="true"
            >
              All
            </button>
            <button
              type="button"
              class="filter-btn"
              data-filter="active"
              role="tab"
              aria-selected="false"
            >
              Active
            </button>
            <button
              type="button"
              class="filter-btn"
              data-filter="completed"
              role="tab"
              aria-selected="false"
            >
              Completed
            </button>
          </div>
          <p class="list-count" id="listCount" aria-live="polite"></p>
        </div>

        <ul id="taskList" class="task-list" aria-live="polite"></ul>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">📋</div>
          <h3 id="emptyTitle">No tasks yet</h3>
          <p id="emptyMessage">Add your first task above to get started.</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>TaskFlow AI — saved locally in your browser</p>
    </footer>

    <dialog id="editDialog" class="edit-dialog">
      <form id="editForm" method="dialog" class="edit-form">
        <header class="dialog-header">
          <h2>Edit task</h2>
          <button type="button" class="btn btn-icon btn-ghost" id="editClose" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </header>
        <input type="hidden" id="editTaskId" />
        <div class="field">
          <label for="editTitle">Title</label>
          <input type="text" id="editTitle" maxlength="120" required />
          <p class="field-error" id="editTitleError" role="alert"></p>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="editPriority">Priority</label>
            <select id="editPriority">
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="field">
            <label for="editDueDate">Due date</label>
            <input type="date" id="editDueDate" required />
            <p class="field-error" id="editDueDateError" role="alert"></p>
          </div>
        </div>
        <footer class="dialog-footer">
          <button type="button" class="btn btn-ghost" id="editCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </footer>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
